<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#183429" />
    <title>You're offline · homie</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f7f5;
        color: #1b2e26;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        place-items: center;
      }
      main {
        width: min(100%, 28rem);
        text-align: center;
      }
      .mark {
        color: #267144;
        font-size: 2rem;
        font-weight: 800;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        color: #66776f;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        margin-top: 1rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #267144;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #3e9b63;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">homie</div>
      <h1>You're offline</h1>
      <p>
        Connect to the internet to access your memories. Your private
        information isn't available offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
